[package]
name = "asciivision"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", features = ["crossterm"] }
tachyonfx = "0.16"
ffmpeg-next = "8.1"
ffmpeg-sys-next = "8.1"
crossbeam-channel = "0.5"
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = "0.24"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
chrono = "0.4"
rand = "0.8"
sysinfo = "0.33"
tokio-stream = "0.1"
portable-pty = "0.9"
vt100 = { package = "vt100-ctt", version = "0.17.1", default-features = false }
flate2 = "1.1.9"
base64 = "0.22.1"
rayon = "1.12.0"
# default-features off drops the chafa C-lib dependency (only enriches the
# halfblocks fallback, which we don't use) and the heavy avif/rav1e codecs.
# Kitty is native, iTerm2 needs image/png, Sixel uses pure-Rust icy_sixel.
ratatui-image = { version = "=9.0.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
